[package]
name = "wfetch"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive", "string"] }
clap_complete = "4.6.7"
crossterm = "0.29.0"
dirs = "6.0.0"
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
image = "0.25.10"
libc = "0.2.189"
nix = { version = "0.31.3", features = ["process"] }
palette = "0.7.6"
rexiv2 = { version = "0.10.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
sysinfo = "0.39.6"
xterm-query = "0.6.0"

[build-dependencies]
clap = { version = "4.6.4", features = ["derive", "string"] }
clap_complete = "4.6.7"
clap_mangen = "0.3.0"

[features]
default = ["nixos"]
nixos = []

[lints.clippy]
enum_glob_use = "deny"
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
option_if_let_else = { level = "allow", priority = 1 }
unwrap_used = "deny"

# faster image operations in dev
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.fast_image_resize]
opt-level = 3

[profile.release]
strip = true
lto = true
